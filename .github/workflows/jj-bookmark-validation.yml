name: Jujutsu bookmark validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  jj-bookmarks:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@v3.21.0

      - name: Run jj bookmark list and enforce main only
        id: validate
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
            nix shell nixpkgs#jujutsu --command bash -euo pipefail -c '
              jj git init --colocate .
              jj git import
              jj bookmark list --all-remotes | tee /tmp/jj-bookmark-list.txt

              mapfile -t remote_refs < <(
                git for-each-ref --format="%(refname:strip=3)" refs/remotes/origin \
                  | grep -v "^HEAD$" \
                  | sort
              )
              printf "remote refs:\n"
              printf "- %s\n" "${remote_refs[@]}"

              [ "${#remote_refs[@]}" -eq 1 ]
              [ "${remote_refs[0]}" = main ]
              grep -Eq "(^|[[:space:]])main(@origin)?(:|[[:space:]])" /tmp/jj-bookmark-list.txt
            '
          } 2>&1 | tee /tmp/jj-bookmark-validation.log
          rc=${PIPESTATUS[0]}
          printf 'exit-code: %s\n' "$rc" | tee -a /tmp/jj-bookmark-validation.log
          exit "$rc"

      - name: Persist failed diagnostics
        if: failure()
        run: |
          set -euo pipefail
          content="$(base64 -w 0 /tmp/jj-bookmark-validation.log)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.github/jj-bookmark-validation.log" \
            -f message='Record jj bookmark validation failure' \
            -f content="$content" \
            -f branch=main

      - name: Record successful bookmark status
        if: success()
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=jj-bookmark-list \
            -f description='jj bookmark list verified only main locally and remotely'

      - name: Record failed bookmark status
        if: failure()
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context=jj-bookmark-list \
            -f description='jj bookmark list found an invalid bookmark state'
