name: Cleanup stale agent branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-agent-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Delete known stale agent branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            agent/fix-external-hdd-initrd
            agent/pin-recovery-and-build-initrd
            agent/strong-recovery-validation
            agent/upload-recovery-report
            agent/verify-live-installer
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api "repos/$REPOSITORY/git/ref/heads/$encoded" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded"
              printf 'deleted %s\n' "$branch"
            else
              printf 'already absent %s\n' "$branch"
            fi
          done
