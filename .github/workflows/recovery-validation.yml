name: Recovery validation

on:
  pull_request:
    paths:
      - recover-external-hdd
      - modules/external-hdd-backup.nix
      - modules/external-hdd-backup-initrd.nix
      - flake.nix
      - flake.lock
      - tests/verify-recovery.sh
      - .github/workflows/recovery-validation.yml
  push:
    branches: [main]
    paths:
      - recover-external-hdd
      - modules/external-hdd-backup.nix
      - modules/external-hdd-backup-initrd.nix
      - flake.nix
      - flake.lock
      - tests/verify-recovery.sh
      - .github/workflows/recovery-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@v3.21.0
      - run: tests/verify-recovery.sh .
