name: Recovery validation

on:
  pull_request:
    paths:
      - bootstrap-live-recovery
      - recover-external-hdd
      - modules/external-hdd-backup.nix
      - modules/external-hdd-backup-initrd.nix
      - modules/recovery-remote.nix
      - windows/nixos-recovery.ps1
      - docs/remote-recovery.md
      - README.md
      - flake.nix
      - flake.lock
      - tests/verify-recovery.sh
      - .github/workflows/recovery-validation.yml
  push:
    branches: [main]
    paths:
      - bootstrap-live-recovery
      - recover-external-hdd
      - modules/external-hdd-backup.nix
      - modules/external-hdd-backup-initrd.nix
      - modules/recovery-remote.nix
      - windows/nixos-recovery.ps1
      - docs/remote-recovery.md
      - README.md
      - flake.nix
      - flake.lock
      - tests/verify-recovery.sh
      - .github/workflows/recovery-validation.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  recovery-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@v3.21.0

      - name: Bash syntax
        id: syntax
        continue-on-error: true
        run: |
          bash -n bootstrap-live-recovery
          bash -n recover-external-hdd
          bash -n tests/verify-recovery.sh

      - name: PowerShell syntax
        id: powershell
        continue-on-error: true
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw windows/nixos-recovery.ps1)) | Out-Null

      - name: ShellCheck
        id: shellcheck
        continue-on-error: true
        run: |
          rev="$(sed -n 's/^NIXPKGS_REV="\([0-9a-f]\{40\}\)"$/\1/p' recover-external-hdd)"
          test -n "$rev"
          set +e
          nix shell "github:NixOS/nixpkgs/$rev#shellcheck" \
            --command shellcheck --exclude=SC2016 --format=gcc \
              bootstrap-live-recovery recover-external-hdd tests/verify-recovery.sh \
            >shellcheck.txt 2>&1
          rc=$?
          set -e
          cat shellcheck.txt
          exit "$rc"

      - name: Static safety invariants
        id: static
        if: always()
        continue-on-error: true
        run: |
          set +e
          bash tests/verify-recovery.sh static . >static-validation.txt 2>&1
          rc=$?
          set -e
          cat static-validation.txt
          exit "$rc"

      - name: Nix configuration evaluation
        id: nix_eval
        if: always()
        continue-on-error: true
        run: |
          set +e
          bash tests/verify-recovery.sh nix . >nix-evaluation.txt 2>&1
          rc=$?
          set -e
          cat nix-evaluation.txt
          exit "$rc"

      - name: Build and inspect specialisation initrd
        id: initrd_build
        if: always()
        continue-on-error: true
        run: |
          set +e
          bash tests/verify-recovery.sh build-initrd . >initrd-build.txt 2>&1
          rc=$?
          set -e
          cat initrd-build.txt
          exit "$rc"

      - name: Record validation outcomes
        if: always()
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          POWERSHELL: ${{ steps.powershell.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          STATIC: ${{ steps.static.outcome }}
          NIX_EVAL: ${{ steps.nix_eval.outcome }}
          INITRD_BUILD: ${{ steps.initrd_build.outcome }}
        run: |
          printf 'syntax=%s\npowershell=%s\nshellcheck=%s\nstatic=%s\nnix-eval=%s\ninitrd-build=%s\n' \
            "$SYNTAX" "$POWERSHELL" "$SHELLCHECK" "$STATIC" "$NIX_EVAL" "$INITRD_BUILD" \
            | tee validation-outcomes.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: recovery-validation-${{ github.run_id }}
          path: |
            shellcheck.txt
            static-validation.txt
            nix-evaluation.txt
            initrd-build.txt
            ci-initrd-files.txt
            ci-initrd-sha256.txt
            validation-outcomes.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce validation results
        if: always()
        run: |
          grep -Fx 'syntax=success' validation-outcomes.txt
          grep -Fx 'powershell=success' validation-outcomes.txt
          grep -Fx 'shellcheck=success' validation-outcomes.txt
          grep -Fx 'static=success' validation-outcomes.txt
          grep -Fx 'nix-eval=success' validation-outcomes.txt
          grep -Fx 'initrd-build=success' validation-outcomes.txt

      - name: Persist failed diagnostics
        if: failure()
        run: |
          set -euo pipefail
          {
            printf '## validation-outcomes.txt\n'
            cat validation-outcomes.txt 2>/dev/null || true
            for file in shellcheck.txt static-validation.txt nix-evaluation.txt initrd-build.txt; do
              printf '\n## %s\n' "$file"
              cat "$file" 2>/dev/null || printf 'missing\n'
            done
          } > /tmp/recovery-validation.log
          content="$(base64 -w 0 /tmp/recovery-validation.log)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.github/recovery-validation.log" \
            -f message='Record recovery validation failure' \
            -f content="$content" \
            -f branch=main

      - name: Record successful recovery status
        if: success()
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=recovery-validation \
            -f description='Recovery scripts, Nix evaluation, and initrd build passed'

      - name: Record failed recovery status
        if: failure()
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context=recovery-validation \
            -f description='Recovery validation failed; inspect .github/recovery-validation.log'
